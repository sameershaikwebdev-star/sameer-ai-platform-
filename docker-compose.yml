services:

  ai-gateway:
    build:
      context: ./services/ai-gateway
    container_name: ai-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPRING_AI_OLLAMA_CHAT_MODEL: Nuh
      SPRING_AI_TAVILY_API_KEY: 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
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  python-service:
    build:
      context: ./services/python-service
    container_name: python-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  whatsapp-bot:
    build:
      context: ./services/whatsapp-bot
    container_name: whatsapp-bot
    volumes:
      - ./services/whatsapp-bot/auth:/app/auth
    environment:
      SPRING_API_URL: http://ai-gateway:8080/api/ai/chat
    depends_on:
      - ai-gateway
      - python-service
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
